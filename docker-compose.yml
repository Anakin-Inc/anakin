services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: anakinscraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  smokescreen:
    build: ./smokescreen
    # The browser's only route out: allows public destinations, refuses loopback, private and link-local (cloud metadata) addresses.
    networks: [default, browser-egress]
    restart: unless-stopped

  browser-service:
    build: ./browser-service
    # Internal network only, so traffic that ignores the proxy has nowhere to go.
    # The Playwright endpoint is unauthenticated and is not published to the host.
    networks: [browser-egress]
    depends_on: [smokescreen]
    environment:
      PORT: "9222"
      WS_PATH: camoufox
      HEADLESS: "true"
      HEALTH_CHECK_PORT: "8080"
      PROXY_SERVER: http://smokescreen:4750
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      retries: 5

  server:
    build: ./server
    ports: ["8080:8080"]
    networks: [default, browser-egress]
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      browser-service: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/anakinscraper?sslmode=disable
      BROWSER_WS_URL: ws://browser-service:9222/camoufox
      WORKER_POOL_SIZE: "5"
      JOB_TIMEOUT: "120"
      LOG_LEVEL: INFO

networks:
  browser-egress:
    internal: true

volumes:
  postgres_data:
